[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The strategic plan moved to its own subdomain (plan.mauifirepulse.com).
# 301 the old portal path so any shared link keeps working.
[[redirects]]
  from = "/division-plan.html"
  to = "https://plan.mauifirepulse.com/"
  status = 301

[functions]
  node_bundler = "esbuild"
